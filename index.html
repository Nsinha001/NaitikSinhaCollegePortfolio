<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naitik Sinha – Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="on-scene">
<section id="scene">
  <h1>Naitik Sinha</h1>
  <p class="tag">Engineer in training, photographer by habit. Turn the dial, then press the shutter.</p>
  <svg class="cam" id="cam" viewBox="0 0 600 400" aria-label="Camera. Use the mode buttons below, then press the red shutter.">
    <defs>
      <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e8ee"/><stop offset="1" stop-color="#a9b3bf"/></linearGradient>
      <radialGradient id="glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5c7aa6"/><stop offset=".45" stop-color="#1a2640"/><stop offset="1" stop-color="#070a12"/></radialGradient>
    </defs>
    <rect x="30" y="80" width="540" height="290" rx="26" fill="#252e3d"/>
    <rect x="30" y="80" width="540" height="62" rx="22" fill="url(#top)"/>
    <path d="M250 80v-26q0-12 12-12h76q12 0 12 12v26z" fill="url(#top)"/>
    <rect x="30" y="195" width="92" height="175" rx="22" fill="#1a212d"/>
    <g fill="#2f3a4c"><circle cx="50" cy="230" r="3"/><circle cx="70" cy="230" r="3"/><circle cx="90" cy="230" r="3"/><circle cx="50" cy="256" r="3"/><circle cx="70" cy="256" r="3"/><circle cx="90" cy="256" r="3"/><circle cx="50" cy="282" r="3"/><circle cx="70" cy="282" r="3"/><circle cx="90" cy="282" r="3"/></g>
    <rect x="148" y="98" width="42" height="26" rx="4" fill="#38455a"/><circle cx="530" cy="170" r="9" fill="#38455a"/>
    <rect x="212" y="102" width="176" height="26" rx="4" fill="#0b1119"/>
    <text id="lcd" class="lcdt" x="300" y="119" text-anchor="middle"></text>
    <g class="dial" transform="translate(95 55)"><circle r="40" fill="#0d121b"/><circle r="35" fill="#cfd6df"/><circle r="32" fill="none" stroke="#7e8997" stroke-width="1"/><circle r="27" fill="#dbe1e7" stroke="#aeb7c2" stroke-width="1"/>
      <g id="dr"><g font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="14" fill="#16202b" text-anchor="middle">
        <text y="-17">D</text><text transform="rotate(60)" y="-17">P</text><text transform="rotate(120)" y="-17">S</text><text transform="rotate(180)" y="-17">R</text><text transform="rotate(240)" y="-17">J</text><text transform="rotate(300)" y="-17">@</text></g>
        <circle r="6" fill="#16202b"/></g>
      <path d="M-6 -46h12l-6 9z" fill="#d8352a"/></g>
    <rect id="dialhit" x="55" y="15" width="80" height="80" fill="transparent" style="cursor:pointer"><title>Turn dial</title></rect>
    <g id="shut" role="button" tabindex="0" transform="translate(500 52)"><title>Shutter</title><circle r="28" fill="#12171f" stroke="#59667a" stroke-width="2"/><circle r="21" fill="#252e3d"/><circle class="cap" r="16" fill="#d8352a"/><circle class="cap" r="16" fill="none" stroke="#ffffff55" stroke-width="2"/><circle r="4" fill="#ff756b" opacity=".9"/></g>
    <circle cx="300" cy="245" r="112" fill="#10151e"/><circle cx="300" cy="245" r="100" fill="#3b475a"/><circle cx="300" cy="245" r="88" fill="#171e2a"/>
    <circle cx="300" cy="245" r="70" fill="none" stroke="#5a6a82" stroke-width="3" stroke-dasharray="3 5"/>
    <circle cx="300" cy="245" r="58" fill="url(#glass)"/><ellipse cx="282" cy="224" rx="16" ry="9" fill="#ffffff" opacity=".18"/>
    <g class="lens-badge" aria-label="Lens specifications">
      <rect x="205" y="366" width="190" height="28" rx="14" fill="#0d121b" stroke="#59667a" stroke-width="1"/>
      <circle cx="224" cy="380" r="3" fill="#d8352a"/>
      <text x="236" y="384" font-family="DM Mono,monospace" font-size="10" fill="#dfe6ef">35mm  ·  f/2.8</text>
    </g>
    <circle id="iris" cx="300" cy="245" r="60" fill="#05070b"/>
  </svg>
  <div class="modes" id="modes" role="group" aria-label="Choose a chapter"></div>
  <div id="hint" aria-live="polite"></div>
</section>
<div id="flash"></div>
<div id="lb" class="lb" role="dialog" aria-modal="true" aria-label="Photo frame"><div class="lbc"><div id="lbf" class="lbf"></div><div class="lbr"><span id="lbt"></span><span><button id="lbu">Use my photo</button> <button id="lbx">Close</button></span></div><input id="lbi" type="file" accept="image/*" hidden></div></div>
<main id="page"></main>
<script src="script.js"></script>
</body>
</html>
